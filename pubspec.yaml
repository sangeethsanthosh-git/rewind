name: spool
description: "Spool - Retro Local Audio Player"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  permission_handler: 11.3.1
  on_audio_query: ^2.9.0
  file_picker: ^13.2.0
  path_provider: ^2.1.6
  sqflite: ^2.4.2+1
  path: ^1.9.1
  google_fonts: ^8.2.1
  palette_generator: ^0.3.3+7
  intl: ^0.20.3
  uuid: ^4.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
